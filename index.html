<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFRINOKBT - Control Panel v7.6 Stable</title>

    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        :root {
            --accent-gold: #c5a059;
            --accent-gold-glow: rgba(197, 160, 89, 0.3);
            --muted-emerald: #169c38;
            --muted-emerald-glow: rgba(36, 138, 61, 0.25);
            --glass-color: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --bg-dark: #0a0b0c69;
            --panel-bg: rgba(17, 19, 21, 0.419);
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;
        }

        body { 
            margin: 0;
            background: var(--bg-dark); 
            color: #d1d5db; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .visually-hidden {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; 
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        :focus-visible { outline: 1px solid var(--accent-gold); outline-offset: 2px; }

        .top-bar {
            position: fixed;
            top: 15px; left: 50%; transform: translateX(-50%);
            width: 97%; max-width: 1650px; min-height: 54px;
            background: var(--panel-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; z-index: 1000; box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            box-sizing: border-box; gap: 15px;
        }

        @media (max-width: 1400px) {
            .top-bar { flex-wrap: wrap; justify-content: center; }
        }

        .bar-group { display: flex; align-items: center; gap: 8px; }
        .center-group { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }

        .label-text { 
            font-size: 12px;
            text-transform: uppercase; 
            font-weight: 700; color: rgba(255,255,255,0.4); 
            letter-spacing: 1.5px; user-select: none;
        }

        .glass-item {
            background: var(--glass-color);
            border: 1px solid var(--glass-border);
            color: #fff; padding: 0 12px; border-radius: 6px;
            font-size: 14px; outline: none; transition: all 0.2s ease;
            height: 36px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
        }
        
        input[type="date"] { color-scheme: dark; font-family: var(--font-mono); font-size: 13px; cursor: pointer; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6) sepia(1) saturate(5) hue-rotate(10deg); cursor: pointer; opacity: 0.7; transition: 0.2s; }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }

        .btn-icon {
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255,255,255,0.6); width: 36px; height: 36px; 
            padding: 0; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .btn-icon:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .btn-icon svg { width: 16px; height: 16px; transition: transform 0.15s; }
        .btn-icon:active svg { transform: scale(0.9); }

        .btn-icon.active-mode { color: var(--muted-emerald) !important; background: var(--muted-emerald-glow) !important; }
        #reset-btn { color: rgba(223, 61, 61, 0.695); }
        #reset-btn:hover { color: #ff5555; background: rgba(204, 68, 68, 0.1); }

        #smart-paste { width: 90px; text-align: center; font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.5px; }
        #smart-paste:focus { border-color: var(--accent-gold); box-shadow: 0 0 10px var(--accent-gold-glow); background: rgba(255,255,255,0.04); }
        #smart-paste::placeholder { color: rgba(255,255,255,0.2); }

        .active-cam-text {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600; color: var(--accent-gold); text-transform: uppercase; 
            border: 1px solid rgba(197, 160, 89, 0.15); padding: 0 14px; border-radius: 6px;
            background: rgba(197, 160, 89, 0.02); min-width: 200px; height: 32px;
            display: flex; align-items: center; justify-content: center; 
            box-sizing: border-box; letter-spacing: 0.5px;
            overflow: hidden; text-overflow: ellipsis;
        }

        .system-status { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 1px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .status-dot.loading { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; animation: pulse 1s infinite; }
        .status-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-dot.error { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .time-container { display: flex; align-items: center; gap: 10px; }
        .time-display { font-family: var(--font-mono); font-size: 16px; font-weight: 500; color: var(--accent-gold); text-shadow: 0 0 8px var(--accent-gold-glow); min-width: 85px; text-align: center; letter-spacing: 0.5px; }
        .archive-indicator { display: none; color: #cc4444; font-size: 10px; font-weight: 700; letter-spacing: 1px; border: 1px solid rgba(204,68,68,0.25); padding: 2px 6px; border-radius: 4px; background: rgba(204,68,68,0.05); text-transform: uppercase; }

        .map-viewport { width: 100vw; height: 100vh; box-sizing: border-box; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .map-container { position: relative; display: inline-block; width: 100vw; height: auto; transition: cursor 0.2s ease; padding: 120px 40px 60px 40px; box-sizing: border-box; }
        #map-layer { position: relative; display: block; width: 100%; height: auto; background: #000; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .map-img { display: block; width: 100%; height: auto; opacity: 0.8; pointer-events: none; border-radius: 6px; }

        .camera-btn {
            position: absolute;
            width: 12px; height: 12px; padding: 0;
            background: rgba(20, 22, 24, 0.6); border: 1px solid rgba(197, 160, 89, 0.4);
            border-radius: 50%;
            cursor: pointer; transform: translate(-50%, -50%);
            z-index: 10; transition: all 0.2s ease; appearance: none;
            box-shadow: 0 0 6px rgba(197, 160, 89, 0.2);
        }
        .camera-btn:hover, .camera-btn:focus-visible { background: var(--accent-gold); box-shadow: 0 0 15px var(--accent-gold), 0 0 4px #ffffff05; transform: translate(-50%, -50%) scale(1.5); z-index: 100; }
        .camera-btn.active-selected { background: var(--accent-gold) !important; border: 2px solid #ffffff07 !important; box-shadow: 0 0 15px var(--accent-gold), 0 0 5px #fff; transform: translate(-50%, -50%) scale(1.6); z-index: 100; }
        .camera-btn::after {
            content: attr(data-name);
            position: absolute; bottom: 18px; left: 50%;
            transform: translateX(-50%); background: #111214; color: #e5e7eb; padding: 5px 10px; border-radius: 4px; font-size: 11px;
            display: none; border: 1px solid rgba(197, 160, 89, 0.3); white-space: nowrap; pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7); font-weight: 500;
            font-family: var(--font-mono);
        }
        .camera-btn:hover::after, .camera-btn:focus-visible::after { display: block; }

        .fire-shield-marker {
            position: absolute;
            width: 5px; height: 9px;
            background: rgba(223, 61, 61, 0.15); border: 2px solid #df3d3d;
            border-radius: 3px; cursor: help; transform: translate(-50%, -50%);
            z-index: 9; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
        }
        .fire-shield-marker::before { content: ''; width: 3px; height: 6px; background: #df3d3d; border-radius: 1px; }
        .fire-shield-marker:hover { background: rgba(223, 61, 61, 0.4); box-shadow: 0 0 15px rgba(223, 61, 61, 0.8); transform: translate(-50%, -50%) scale(1.5); z-index: 105; }
        .fire-shield-marker::after {
            content: attr(data-id);
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #111214; color: #ff5555; padding: 5px 10px; border-radius: 4px; font-size: 11px;
            display: none; border: 1px solid rgba(223, 61, 61, 0.5); white-space: nowrap; pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8); font-weight: 700;
            font-family: var(--font-mono);
        }
        .fire-shield-marker:hover::after { display: block; }

        .footer-sig {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 15px;
            font-size: 9px; letter-spacing: 6px; font-weight: 600; color: rgba(255,255,255,0.15);
            text-align: center; text-transform: uppercase; z-index: 999; pointer-events: none;
        }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-dark); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: var(--accent-gold); font-family: var(--font-mono); font-size: 15px; transition: opacity 0.5s ease;
        }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(197, 160, 89, 0.3); border-top: 3px solid var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
    <div>СТАРТ СИСТЕМЫ...</div>
</div>

<header class="top-bar">
    <div class="bar-group">
        <label for="master-date" class="label-text">Дата</label>
        <input type="date" id="master-date" class="glass-item" aria-label="Выберите дату архива">
    </div>

    <div class="bar-group">
        <label for="smart-paste" class="label-text">Время</label>
        <input type="text" id="smart-paste" class="glass-item" placeholder="00:00:00" maxlength="8">
        
        <button type="button" id="copy-btn" class="btn-icon" title="Скопировать ссылку генерации">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
        </button>
    </div>

    <div class="center-group">
        <div id="active-cam-text" class="active-cam-text" aria-live="polite">КАМЕРА НЕ ВЫБРАНА</div>
        <div class="system-status">
            <span id="status-dot" class="status-dot loading"></span>
            <span id="status-text">Загрузка базы...</span>
        </div>
    </div>

    <div class="bar-group time-container">
        <div id="clock-view" class="time-display" aria-live="polite">LIVE</div>
        
        <div id="archive-indicator" class="archive-indicator" aria-hidden="true">Архив</div>
        
        <button type="button" id="play-btn" class="btn-icon" title="Запустить / Остановить секундомер">
            <svg id="play-svg" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
        </button>
    </div>

    <div class="bar-group">
        <button type="button" id="minus-time-btn" class="btn-icon" title="Назад на 1 минуту (Shift + ←)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="11 17 6 12 11 7"></polyline>
                <polyline points="18 17 13 12 18 7"></polyline>
            </svg>
        </button>
        
        <button type="button" id="plus-time-btn" class="btn-icon" title="Вперед на 1 минуту (Shift + →)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="13 17 18 12 13 7"></polyline>
                <polyline points="6 17 11 12 6 7"></polyline>
            </svg>
        </button>
        
        <button type="button" id="reset-btn" class="btn-icon" title="Сбросить в LIVE (Alt + R)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"></path>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
        </button>
    </div>
</header>

<main class="map-viewport" id="viewport">
    <div class="map-container" id="wrapper">
        <div id="map-layer">
            <img src="Sklad.png" class="map-img" alt="Схема склада">
        </div>
    </div>
</main>

<footer class="footer-sig">
    DEVELOPED BY D. MARTINKEVICH FOR SOFRINOKBT 
</footer>

        { "id": "5.65", "left": "51.96%", "top": "82.9%" }, { "id": "5.66", "left": "76.75%", "top": "82.9%" }
    ];

    let cameras = [];
    const ARCHIVE_MIN = new Date('2000-01-01').getTime();
    const ARCHIVE_MAX = Date.now();
    let isLiveMode = true;
    let currentMs = Date.now();
    let timer = null;
    let activeCam = null;
    
    const els = {
        smartInput: document.getElementById('smart-paste'),
        dateInput: document.getElementById('master-date'),
        clockView: document.getElementById('clock-view'),
        playBtn: document.getElementById('play-btn'),
        playSvg: document.getElementById('play-svg'),
        archiveInd: document.getElementById('archive-indicator'),
        wrapper: document.getElementById('wrapper'),
        mapLayer: document.getElementById('map-layer'),
        statusText: document.getElementById('status-text'),
        statusDot: document.getElementById('status-dot'),
        loadingOverlay: document.getElementById('loading-overlay')
    };

    // БЛОК 1: ИНИЦИАЛИЗАЦИЯ КАРТЫ (Panzoom)
    const panzoom = Panzoom(els.wrapper, { maxScale: 5, minScale: 1, startScale: 1, step: 0.2, contain: 'outside' });
    document.getElementById('viewport').addEventListener('wheel', panzoom.zoomWithWheel);

    const mapImage = els.mapLayer.querySelector('.map-img');
    if (mapImage) {
        mapImage.addEventListener('load', () => panzoom.reset());
        if (mapImage.complete) panzoom.reset();
    }

    // БЛОК 2: ИНИЦИАЛИЗАЦИЯ ДАТЫ С УЧЕТОМ ЧАСОВОГО ПОЯСА
    const today = new Date();
    today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
    els.dateInput.value = today.toISOString().slice(0, 10);

    // БЛОК 3: ЛОГИКА ОТОБРАЖЕНИЯ И ТАЙМЕРА
    function setStatus(state, text) {
        els.statusText.textContent = text;
        els.statusDot.className = `status-dot ${state}`;
    }
    
    function clampArchive(ms) { return (ms < ARCHIVE_MIN) ? ARCHIVE_MIN : (ms > ARCHIVE_MAX) ? ARCHIVE_MAX : ms; }

    function updateDisplay() {
        if (isLiveMode) {
            els.clockView.textContent = "Прямой эфир";
            els.clockView.style.color = 'var(--muted-emerald)';
            els.clockView.style.textShadow = '0 0 10px rgba(36, 138, 61, 0.4)';
            els.archiveInd.style.display = 'none';
        } else {
            els.clockView.textContent = new Date(currentMs).toTimeString().split(' ')[0];
            els.clockView.style.color = 'var(--accent-gold)';
            els.clockView.style.textShadow = '0 0 10px var(--accent-gold-glow)';
            els.archiveInd.style.display = 'block';
        }
    }

    function setLiveMode() {
        isLiveMode = true;
        if (timer) { clearInterval(timer); timer = null; }
        document.getElementById('play-btn').classList.remove('active-mode');
        els.playSvg.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"></polygon>`;
        currentMs = Date.now();
        updateDisplay();
    }

    function setArchiveMode(timestamp) {
        isLiveMode = false;
        currentMs = clampArchive(timestamp);
        updateDisplay();
    }

    function toggleTimer() {
        if (isLiveMode) return;
        if (timer) {
            clearInterval(timer); timer = null;
            document.getElementById('play-btn').classList.remove('active-mode');
            els.playSvg.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"></polygon>`;
        } else {
            timer = setInterval(() => { currentMs = clampArchive(currentMs + 1000); updateDisplay(); }, 1000);
            document.getElementById('play-btn').classList.add('active-mode');
            els.playSvg.innerHTML = `<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>`;
        }
    }

    function adjustTime(mins) {
        if (isLiveMode) setArchiveMode(Date.now());
        currentMs = clampArchive(currentMs + mins * 60000);
        updateDisplay();
    }

    function buildUrl(baseUrl, ms) {
        if (!baseUrl) return '';
        const safeMs = Number(ms) || 0;
        try {
            const urlObj = new URL(baseUrl);
            if (!isLiveMode && safeMs > 0) urlObj.searchParams.set('date', safeMs);
            return urlObj.toString();
        } catch (e) {
            let link = baseUrl;
            if (!isLiveMode && safeMs > 0) link += (link.includes('?') ? '&' : '?') + `date=${safeMs}`;
            return link;
        }
    }

    // БЛОК 4: СИНХРОНИЗАЦИЯ ПОЛЕЙ ВВОДА ДАТЫ И ВРЕМЕНИ
    els.dateInput.addEventListener('change', () => {
        if (els.smartInput.value.replace(/\D/g, '').length >= 4) {
            els.smartInput.dispatchEvent(new Event('input'));
        }
    });

    els.smartInput.addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, ''); 
        if (val.length > 6) val = val.substring(0, 6);
        
        let formatted = '';
        if (val.length > 0) formatted += val.substring(0, 2);
        if (val.length > 2) formatted += ':' + val.substring(2, 4);
        if (val.length > 4) formatted += ':' + val.substring(4, 6);
        
        e.target.value = formatted;

        if (val.length >= 4) {
            const h = Number(val.substring(0, 2));
            const m = Number(val.substring(2, 4));
            const s = val.length >= 6 ? Number(val.substring(4, 6)) : 0;
            
            if (h <= 23 && m <= 59 && s <= 59) {
                const dVal = els.dateInput.value;
                let dateObj = new Date();
                if (dVal) {
                    const parts = dVal.split('-');
                    dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
                }
                dateObj.setHours(h, m, s, 0);
                setArchiveMode(dateObj.getTime());
            }
        }
    });

    // БЛОК 5: УВЕДОМЛЕНИЯ И СОБЫТИЯ КНОПОК
    function setActiveCam(cam) {
        activeCam = cam;
        const camText = document.getElementById('active-cam-text');
        if (cam) {
            camText.textContent = cam.name;
            camText.title = cam.url;
        } else {
            camText.textContent = 'КАМЕРА НЕ ВЫБРАНА';
            camText.title = '';
        }
    }

    function flashTemporary(text, ms = 1400) {
        const toast = document.createElement('div');
        toast.textContent = text;
        Object.assign(toast.style, {
            position: 'fixed', right: '20px', bottom: '20px', background: 'rgba(0,0,0,0.8)',
            color: '#fff', padding: '10px 15px', borderRadius: '8px', zIndex: 3000,
            fontFamily: 'Segoe UI, system-ui, sans-serif', fontSize: '14px', boxShadow: '0 5px 15px rgba(0,0,0,0.5)'
        });
        document.body.appendChild(toast);
        setTimeout(() => toast.style.opacity = '0.01', ms - 200);
        setTimeout(() => toast.remove(), ms);
    }

    document.getElementById('copy-btn').addEventListener('click', async () => {
        if (!activeCam) { flashTemporary('Выберите камеру'); return; }
        const url = buildUrl(activeCam.url, isLiveMode ? 0 : currentMs);
        try { await navigator.clipboard.writeText(url); flashTemporary('Ссылка скопирована'); } 
        catch (err) { flashTemporary('Не удалось скопировать'); }
    });

    document.getElementById('minus-time-btn').addEventListener('click', () => adjustTime(-1));
    document.getElementById('plus-time-btn').addEventListener('click', () => adjustTime(1));
    document.getElementById('reset-btn').addEventListener('click', () => setLiveMode());
    document.getElementById('play-btn').addEventListener('click', toggleTimer);
    
    // БЛОК 6: ПЕРЕХВАТЧИК ГЛОБАЛЬНЫХ КЛАВИШ И ВСТАВКИ
    document.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        if (e.shiftKey && e.key === 'ArrowLeft') adjustTime(-1);
        if (e.shiftKey && e.key === 'ArrowRight') adjustTime(1);
        if (e.altKey && (e.key === 'r' || e.key === 'R')) setLiveMode();
    });

    document.addEventListener('paste', (event) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        const pastedText = (event.clipboardData || window.clipboardData).getData('text').trim();
        
        const timeMatch = pastedText.match(/([01]?\d|2[0-3])[:\.\-\s]?([0-5]\d)(?:[:\.\-\s]?([0-5]\d))?/);
        let digitsOnly = '';
        
        if (timeMatch) {
            let h = timeMatch[1].padStart(2, '0');
            let m = timeMatch[2];
            let s = timeMatch[3] || '00';
            digitsOnly = h + m + s;
        } else {
            digitsOnly = pastedText.replace(/\D/g, '');
        }

        if (digitsOnly.length >= 4) {
            const val = digitsOnly.substring(0, 6);
            const h = Number(val.substring(0, 2));
            const m = Number(val.substring(2, 4));
            if (h <= 23 && m <= 59) {
                els.smartInput.value = val;
                els.smartInput.dispatchEvent(new Event('input'));
                flashTemporary(`Время обновлено`, 2000);
            }
        }
    });

    // БЛОК 7: ГЕНЕРАЦИЯ ЭЛЕМЕНТОВ НА КАРТЕ
    function buildFireShields() {
        fireShieldsData.forEach(shield => {
            const marker = document.createElement('div');
            marker.className = 'fire-shield-marker';
            marker.setAttribute('data-id', shield.id);
            marker.style.left = shield.left;
            marker.style.top = shield.top;
            els.mapLayer.appendChild(marker);
        });
    }

    function buildCameraButtons() {
        cameras.forEach(cam => {
            const btn = document.createElement('button');
            btn.className = 'camera-btn';
            btn.setAttribute('data-name', cam.name);
            btn.setAttribute('aria-label', `Открыть камеру ${cam.name}`);
            btn.style.left = cam.left;
            btn.style.top = cam.top;
            btn.tabIndex = 0;

            btn.addEventListener('click', (ev) => {
                ev.stopPropagation();
                els.mapLayer.querySelectorAll('.camera-btn').forEach(b => b.classList.remove('active-selected'));
                btn.classList.add('active-selected');
                setActiveCam(cam);
                window.open(buildUrl(cam.url, isLiveMode ? 0 : currentMs), '_blank', 'noopener,noreferrer');
            });
            els.mapLayer.appendChild(btn);
        });
    }

    // БЛОК 8: СБОРКА И ЗАПУСК (FETCH)
    async function init() {
        try {
            setStatus('loading', 'Синхронизация...');
            const response = await fetch(GAS_WEB_APP_URL);
            
            if (!response.ok) throw new Error(`Ошибка сервера: ${response.status}`);
            const rawData = await response.json();
            if (!Array.isArray(rawData)) throw new Error('Неверный формат данных от сервера');
            
            const uniqueNames = new Set();
            cameras = rawData.filter(cam => {
                if (!cam.name || !cam.name.trim() || !cam.url || !cam.url.trim() || cam.url === 'URL_ЗДЕСЬ') return false;
                cam.name = cam.name.replace(/\s+/g, ' ').trim();
                if (uniqueNames.has(cam.name)) return false;
                uniqueNames.add(cam.name);
                cam.url = cam.url.trim();
                return true;
            });
            
            buildCameraButtons();
            buildFireShields();
            setStatus('online', `Камер: ${cameras.length}`);
            
        } catch (error) {
            console.error('Ошибка инициализации:', error);
            setStatus('error', 'Нет связи с базой');
            flashTemporary('Ошибка загрузки конфигурации', 4000);
        } finally {
            els.loadingOverlay.style.opacity = '0';
            setTimeout(() => els.loadingOverlay.remove(), 500);
        }
    }

    init();
    setActiveCam(null);
    updateDisplay();
});
</script>
</body>
