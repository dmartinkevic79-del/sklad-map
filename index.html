<!DOCTYPE html>

    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; }
        .map-container { position: relative; display: inline-block; margin-top: 20px; border: 1px solid #444; }
        .map-img { display: block; max-width: 100%; height: auto; }
        
        /* Стиль прозрачного кружка */
        .camera-btn {
            position: absolute; width: 12px; height: 12px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid #2a02da00;
            border-radius: 50%; cursor: pointer; transform: translate(-50%, -50%);
            transition: 0.2s; z-index: 10;
        }
        .camera-btn:hover { 
            background: rgba(255, 193, 7, 0.8); border-color: #fff; 
            transform: translate(-50%, -50%) scale(1.5); 
        }

        /* Всплывающая подсказка с названием */
        .camera-btn::after {
            content: attr(data-name); position: absolute; bottom: 15px; left: 50%;
            transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white;
            padding: 2px 6px; border-radius: 4px; font-size: 10px; white-space: nowrap;
            display: none; pointer-events: none;
        }
        .camera-btn:hover::after { display: block; }
    </style>
</head>

                e.stopPropagation();
                if(point.url) window.open(point.url, '_blank');
                else alert("Ссылка для " + point.name + " еще не настроена");
            };
            
            wrapper.appendChild(btn);
        });

        // Помощник для получения координат (F12 -> Console)
        wrapper.onclick = (e) => {
            const rect = wrapper.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(2);
            const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(2);
            console.log(`{ "name": "Новая камера", "left": "${x}%", "top": "${y}%", "url": "" },`);
        };
