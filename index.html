<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SOFRINOKBT - Ultimate Glass Control v2.1</title>
    <style>
        :root {
            --neon-purple: #02f03673; 
            --neon-green: #02f03673;
            --glass-color: rgba(17, 17, 17, 0.055); 
            --glass-border: rgba(255, 255, 255, 0.712);
        }

        body { 
            margin: 0; 
            background: #0505054d; 
            color: #f0f0f0; 
            font-family: 'Segoe UI', 'Roboto', sans-serif; 
            overflow-x: hidden;
        }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ */
        .top-bar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 96%;
            max-width: 1500px;
            height: 60px;
            background: rgba(20, 20, 20, 0.342);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .bar-group { display: flex; align-items: center; gap: 12px; }

        .glass-item {
            background: var(--glass-color);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        /* ИСПРАВЛЕНИЕ КАЛЕНДАРЯ */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            opacity: 0.8;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }

        .btn-glass {
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }
        .btn-glass:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn-purple { color: #ecebec; border-color: rgba(248, 246, 250, 0.534); }
        .btn-active-mode { 
            background: rgba(13, 14, 13, 0.2) !important; 
            border-color: var(--neon-green) !important; 
            color: #ffffff18 !important; 
        }

        #smart-paste {
            width: 280px;
            border-color: var(--neon-purple);
            border-style: solid;
            background: rgba(168, 112, 255, 0.05);
        }

        .time-display {
            font-family: 'Consolas', monospace;
            font-size: 22px;
            color: var(--neon-green);
            padding: 0 10px;
            text-shadow: 0 0 10px rgba(30, 31, 30, 0.4);
        }

        .map-container { 
            position: relative; 
            margin: 100px auto 50px;
            background: #000;
            border-radius: 12px;
            border: 1px solid #222;
            width: fit-content;
        }
        
        .map-img { display: block; max-width: 100%; height: auto; opacity: 0.9; }
        
        /* КНОПКИ КАМЕР */
        .camera-btn {
            position: absolute; width: 14px; height: 14px;
            background: rgba(255, 255, 255, 0); 
            border: 1px solid rgba(255, 255, 255, 0);
            border-radius: 50%; cursor: pointer; transform: translate(-50%, -50%);
            z-index: 10; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }
        
        .camera-btn:hover { 
            background: var(--neon-green); 
            box-shadow: 0 0 15px var(--neon-green); 
            transform: translate(-50%, -50%) scale(1.6); 
            z-index: 100;
        }

        /* АКТИВНОЕ СОСТОЯНИЕ ВЫБРАННОЙ КАМЕРЫ */
        .camera-btn.active-cam {
            background: var(--neon-purple);
            border-color: #ffffff00;
            box-shadow: 0 0 20px var(--neon-purple);
            transform: translate(-50%, -50%) scale(1.4);
            z-index: 101;
        }

        .camera-btn.no-url { opacity: 0.2; cursor: not-allowed; border-style: dotted; }

        .camera-btn::after {
            content: attr(data-name); position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); 
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px);
            color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 11px;
            display: none; border: 1px solid var(--neon-purple); white-space: nowrap;
            pointer-events: none;
        }
        .camera-btn:hover::after { display: block; }

        .footer-sig {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.9)); 
            padding: 15px;
            font-size: 11px; letter-spacing: 4px; font-weight: bold; 
            color: rgba(255,255,255,0.4); /* Сделал ярче для читаемости */
            text-align: center; text-transform: uppercase;
            z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>

<header class="top-bar">
    <div class="bar-group">
        <input type="date" id="master-date" class="glass-item">
    </div>

    <div class="bar-group">
        <input type="text" id="smart-paste" class="glass-item" placeholder="URL ИЛИ ВРЕМЯ (ЧЧ:ММ:СС)">
        <button class="glass-item btn-glass btn-purple" onclick="copyCurrentLink()" title="Копировать метку времени">🔗</button>
    </div>

    <div class="bar-group">
        <div id="clock-view" class="time-display">00:00:00</div>
        <button id="play-btn" class="glass-item btn-glass btn-purple" style="width: 80px;" onclick="toggleTimer()">ПУСК</button>
    </div>

    <div class="bar-group">
        <button class="glass-item btn-glass" onclick="adjustTime(-1)">-1м</button>
        <button class="glass-item btn-glass" onclick="adjustTime(1)">+1м</button>
        <button class="glass-item btn-glass btn-purple" style="color: #f80505;" onclick="resetToLive()">СБРОС</button>
    </div>
</header>

<div class="map-container" id="wrapper">
    <img src="Sklad.png" class="map-img">
</div>

<footer class="footer-sig">
    DEVELOPED BY D. MARTINKEVICH FOR SOFRINOKBT 
</footer>

    let timer = null;
    let currentMs = 0;

    const smartInput = document.getElementById('smart-paste');
    const dateInput = document.getElementById('master-date');
    const clockView = document.getElementById('clock-view');
    const playBtn = document.getElementById('play-btn');

    dateInput.valueAsDate = new Date();

    // SMART PASTE С РУЧНОЙ КОРРЕКТИРОВКОЙ
    smartInput.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if (!val) return;

        // 1. Проверка на URL с датой
        const dateMatch = val.match(/date=(\d+)/);
        if (dateMatch) {
            currentMs = parseInt(dateMatch[1]);
            const d = new Date(currentMs);
            dateInput.value = d.toISOString().split('T')[0];
            updateDisplay();
            return;
        } 

        // 2. Проверка на ручной ввод времени ЧЧ:ММ:СС или ЧЧ:ММ
        const timeMatch = val.match(/^(\d{1,2}):(\d{2}):?(\d{2})?$/);
        if (timeMatch) {
            const d = new Date(dateInput.value);
            d.setHours(parseInt(timeMatch[1]));
            d.setMinutes(parseInt(timeMatch[2]));
            d.setSeconds(parseInt(timeMatch[3]) || 0);
            currentMs = d.getTime();
            updateDisplay();
        }
    });

    function updateDisplay() {
        if (currentMs === 0) {
            clockView.innerText = "Старт";
            return;
        }
        const d = new Date(currentMs);
        clockView.innerText = d.toTimeString().split(' ')[0];
    }

    function toggleTimer() {
        if (timer) {
            clearInterval(timer);
            timer = null;
            playBtn.innerText = "ПУСК";
            playBtn.classList.remove('btn-active-mode');
        } else {
            if (currentMs === 0) currentMs = new Date().getTime();
            timer = setInterval(() => {
                currentMs += 1000;
                updateDisplay();
            }, 1000);
            playBtn.innerText = "СТОП";
            playBtn.classList.add('btn-active-mode');
        }
    }

    function adjustTime(mins) {
        if (currentMs === 0) currentMs = new Date().getTime();
        currentMs += mins * 60000;
        updateDisplay();
    }

    function resetToLive() {
        if (timer) toggleTimer();
        currentMs = 0;
        updateDisplay();
    }

    function copyCurrentLink() {
        if (currentMs === 0) return;
        const link = `?date=${currentMs}`;
        navigator.clipboard.writeText(link).then(() => {
            const oldVal = smartInput.value;
            smartInput.value = "СКОПИРОВАНО!";
            setTimeout(() => smartInput.value = oldVal, 1000);
        });
    }

    const wrapper = document.getElementById('wrapper');
    cameraData.forEach(cam => {
        const btn = document.createElement('div');
        btn.className = 'camera-btn' + (cam.url ? '' : ' no-url');
        btn.style.left = cam.left; btn.style.top = cam.top;
        btn.setAttribute('data-name', cam.name);
        
        btn.onclick = () => {
            if (!cam.url) return;
            
            // Установка активного состояния
            document.querySelectorAll('.camera-btn').forEach(b => b.classList.remove('active-cam'));
            btn.classList.add('active-cam');

            let finalUrl = cam.url;
            if (currentMs > 0) {
                const sep = finalUrl.includes('?') ? '&' : '?';
                finalUrl += `${sep}date=${currentMs}`;
            }
            window.open(finalUrl, '_blank');
        };
        wrapper.appendChild(btn);
    });
</script>
