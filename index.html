<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFRINOKBT - Control Panel v7.0 Security</title>

    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        :root {
            --accent-gold: #c5a059;
            --accent-gold-glow: rgba(197, 160, 89, 0.3);
            --muted-emerald: #169c38;
            --muted-emerald-glow: rgba(36, 138, 61, 0.25);
            --glass-color: rgba(255, 255, 255, 0.02); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --bg-dark: #0a0b0c69;
            --panel-bg: rgba(17, 19, 21, 0.419);
            --font-mono: 'JetBrains Mono', 'Consolas', monospace;
        }

        body { 
            margin: 0; 
            background: var(--bg-dark); 
            color: #d1d5db; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .visually-hidden {
            position: absolute;
            width: 1px; height: 1px; padding: 0; margin: -1px; 
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        :focus-visible {
            outline: 1px solid var(--accent-gold);
            outline-offset: 2px;
        }

        .top-bar {
            position: fixed;
            top: 15px; left: 50%; transform: translateX(-50%);
            width: 97%; max-width: 1650px; height: 54px;
            background: var(--panel-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: nowrap; white-space: nowrap;
            padding: 0 20px; z-index: 1000;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        .bar-group { display: flex; align-items: center; gap: 8px; }

        .label-text { 
            font-size: 10px;
            text-transform: uppercase; 
            font-weight: 700; color: rgba(255,255,255,0.4); 
            letter-spacing: 1.5px; user-select: none;
        }

        .glass-item {
            background: var(--glass-color);
            border: 1px solid var(--glass-border);
            color: #fff; padding: 0 12px; border-radius: 6px;
            font-size: 11px; outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            height: 32px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
        }
        
        input[type="date"] {
            color-scheme: dark;
            font-family: var(--font-mono);
            font-size: 11px; cursor: pointer;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.6) sepia(1) saturate(5) hue-rotate(10deg);
            cursor: pointer; opacity: 0.7; transition: 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }

        .btn-icon {
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255,255,255,0.6); width: 34px; height: 32px; 
            padding: 0; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .btn-icon:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .btn-icon svg { width: 15px; height: 15px; transition: transform 0.15s; }
        .btn-icon:active svg { transform: scale(0.9); }

        .btn-icon.active-mode { 
            color: var(--muted-emerald) !important;
            background: var(--muted-emerald-glow) !important;
        }
        #reset-btn { color: rgba(223, 61, 61, 0.695); }
        #reset-btn:hover { color: #ff5555; background: rgba(204, 68, 68, 0.1); }

        #smart-paste {
            width: 78px; text-align: center; 
            font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.5px;
        }
        #smart-paste:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold-glow); background: rgba(255,255,255,0.04);
        }
        #smart-paste::placeholder { color: rgba(255,255,255,0.2); }

        .active-cam-text {
            font-family: var(--font-mono);
            font-size: 11px; font-weight: 600; 
            color: var(--accent-gold); text-transform: uppercase; 
            border: 1px solid rgba(197, 160, 89, 0.15);
            padding: 0 14px; border-radius: 6px;
            background: rgba(197, 160, 89, 0.02);
            min-width: 160px; max-width: 220px; height: 32px;
            display: flex; align-items: center; justify-content: center; 
            box-sizing: border-box; letter-spacing: 0.5px;
            overflow: hidden; text-overflow: ellipsis;
        }

        .time-container { display: flex; align-items: center; gap: 10px; }
        .time-display {
            font-family: var(--font-mono);
            font-size: 15px; font-weight: 500; color: var(--accent-gold);
            text-shadow: 0 0 8px var(--accent-gold-glow); min-width: 75px; text-align: center;
            letter-spacing: 0.5px;
        }
        .archive-indicator {
            display: none;
            color: #cc4444; font-size: 9px; font-weight: 700;
            letter-spacing: 1px; border: 1px solid rgba(204,68,68,0.25); padding: 2px 6px;
            border-radius: 4px; background: rgba(204,68,68,0.05); text-transform: uppercase;
        }

        /* --- КОНТЕЙНЕР КАРТЫ --- */
        .map-viewport {
            width: 100vw; height: 100vh;
            box-sizing: border-box;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .map-container { 
            position: relative; display: inline-block;
            width: 100vw; height: auto; transition: cursor 0.2s ease;
            padding: 120px 40px 60px 40px; 
            box-sizing: border-box;
        }

        #map-layer {
            position: relative; display: block; width: 100%; height: auto;
            background: #000; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .map-img { 
            display: block; width: 100%; height: auto;
            opacity: 0.8; pointer-events: none; border-radius: 6px;
        }

        /* --- КНОПКИ КАМЕР --- */
        .camera-btn {
            position: absolute; width: 11px; height: 11px; padding: 0;
            background: rgba(20, 22, 24, 0); border: 1px solid rgba(197, 159, 89, 0);
            border-radius: 50%; cursor: pointer; transform: translate(-50%, -50%);
            z-index: 10; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            appearance: none; box-shadow: 0 0 6px rgba(197, 159, 89, 0);
        }
        
        .camera-btn:hover, .camera-btn:focus-visible { 
            background: var(--accent-gold);
            box-shadow: 0 0 15px var(--accent-gold), 0 0 4px #fff; 
            transform: translate(-50%, -50%) scale(1.5); z-index: 100;
        }

        .camera-btn.active-selected {
            background: var(--accent-gold) !important;
            border: 2px solid #ffffff00 !important;
            box-shadow: 0 0 15px var(--accent-gold), 0 0 5px #ffffff01;
            transform: translate(-50%, -50%) scale(1.6);
            z-index: 100;
        }

        .camera-btn::after {
            content: attr(data-name);
            position: absolute; bottom: 18px; left: 50%;
            transform: translateX(-50%); background: #111214;
            color: #e5e7eb; padding: 5px 10px; border-radius: 4px; font-size: 10px;
            display: none; border: 1px solid rgba(197, 160, 89, 0.3); white-space: nowrap; pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7); font-weight: 500; font-family: var(--font-mono);
        }
        .camera-btn:hover::after, .camera-btn:focus-visible::after { display: block; }

        /* --- ПОЖАРНЫЕ ЩИТЫ (НОВЫЕ СТИЛИ) --- */
        .fire-shield-marker {
            position: absolute; width: 4px; height: 8px;
            background: rgba(223, 61, 61, 0.15); border: 2px solid #df3d3d;
            border-radius: 3px; cursor: help; transform: translate(-50%, -50%);
            z-index: 9; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
        }
        
        .fire-shield-marker::before {
            content: ''; width: 0px; height: 0px; background: #df3d3d; border-radius: 1px;
        }
        
        .fire-shield-marker:hover {
            background: rgba(223, 61, 61, 0.4); box-shadow: 0 0 15px rgba(223, 61, 61, 0.8);
            transform: translate(-50%, -50%) scale(1.5); z-index: 105;
        }
        
        .fire-shield-marker::after {
            content: attr(data-id); position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); background: #111214; color: #ff5555; /* Красный текст */
            padding: 5px 10px; border-radius: 4px; font-size: 11px;
            display: none; border: 1px solid rgba(223, 61, 61, 0.5); white-space: nowrap; pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8); font-weight: 700; font-family: var(--font-mono);
        }
        
        .fire-shield-marker:hover::after { display: block; }

        .footer-sig {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 15px;
            font-size: 9px; letter-spacing: 6px; font-weight: 600; color: rgba(255,255,255,0.15);
            text-align: center; text-transform: uppercase; z-index: 999; pointer-events: none;
        }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-dark); z-index: 9999; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            color: var(--accent-gold); font-family: var(--font-mono); font-size: 14px;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(197, 160, 89, 0.3);
            border-top: 3px solid var(--accent-gold); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
</head>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="13 17 18 12 13 7"></polyline>
                <polyline points="6 17 11 12 6 7"></polyline>
            </svg>
        </button>
        
        <button type="button" id="reset-btn" class="btn-icon" title="Сбросить в LIVE (Прямой эфир)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"></path>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
        </button>
    </div>
</header>

    function clampArchive(ms) {
        if (ms < ARCHIVE_MIN) return ARCHIVE_MIN;
        if (ms > ARCHIVE_MAX) return ARCHIVE_MAX;
        return ms;
    }

    function updateDisplay() {
        if (isLiveMode) {
            els.clockView.textContent = "LIVE";
            els.clockView.style.color = 'var(--muted-emerald)';
            els.clockView.style.textShadow = '0 0 10px rgba(36, 138, 61, 0.4)';

            els.clockView.style.textShadow = '0 0 10px var(--accent-gold-glow)';
            els.archiveInd.style.display = 'block';
        }
    }

    function setLiveMode() {

        if (timer) { clearInterval(timer); timer = null; }
        els.playBtn.classList.remove('active-mode');
        els.playSvg.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"></polygon>`;
        currentMs = Date.now();
        updateDisplay();
    }

    function setArchiveMode(timestamp) {
        isLiveMode = false;
        currentMs = clampArchive(timestamp);
        updateDisplay();
    }

    function toggleTimer() {
        if (isLiveMode) return;
        if (timer) {
            clearInterval(timer); timer = null;
            els.playBtn.classList.remove('active-mode');
            els.playSvg.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"></polygon>`;
        } else {
            timer = setInterval(() => {
                currentMs += 1000;
                currentMs = clampArchive(currentMs);
                updateDisplay();
            }, 1000);
            els.playBtn.classList.add('active-mode');
            els.playSvg.innerHTML = `<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>`;

    }

    function adjustTime(mins) {
        if (isLiveMode) setArchiveMode(Date.now());
        currentMs += mins * 60000;
        currentMs = clampArchive(currentMs);
        updateDisplay();
    }

    function buildUrl(baseUrl, ms) {
        if (!baseUrl) return '';
        const safeMs = Number(ms) || 0;
        try {
            const urlObj = new URL(baseUrl);
            if (!isLiveMode && safeMs > 0) urlObj.searchParams.set('date', safeMs);
            return urlObj.toString();
        } catch (e) {
            let link = baseUrl;
            if (!isLiveMode && safeMs > 0) {
                link += (link.includes('?') ? '&' : '?') + `date=${safeMs}`;
            }
            return link;
        }
    }

    function handleTimeInput(e) {
        const val = e.target.value.trim();
        const match = val.match(/^(\d{1,2}):(\d{2}):(\d{2})$/);
        if (!match) return;
        const [ , hStr, mStr, sStr ] = match;
        const h = Number(hStr), m = Number(mStr), s = Number(sStr);
        if (h > 23 || m > 59 || s > 59) return;
        const date = els.dateInput.valueAsDate ? new Date(els.dateInput.valueAsDate) : new Date();
        date.setHours(h, m, s, 0);
        setArchiveMode(date.getTime());
    }

    function setActiveCam(cam) {
        activeCam = cam;
        if (cam) {
            els.activeCamText.textContent = cam.name;
            els.activeCamText.title = cam.url;
        } else {
            els.activeCamText.textContent = 'КАМЕРА НЕ ВЫБРАНА';
            els.activeCamText.title = '';
        }
    }

    els.copyBtn.addEventListener('click', async () => {
        if (!activeCam) {
            flashTemporary('Выберите камеру'); return;
        }
        const url = buildUrl(activeCam.url, isLiveMode ? 0 : currentMs);
        try {
            await navigator.clipboard.writeText(url);
            flashTemporary('Ссылка скопирована');
        } catch (err) {
            console.error('Clipboard write failed', err);
            flashTemporary('Не удалось скопировать');
        }
    });
    
    function flashTemporary(text, ms = 1400) {
        const toast = document.createElement('div');
        toast.textContent = text;
        Object.assign(toast.style, {
            position: 'fixed', right: '20px', bottom: '20px',
            background: 'rgba(0,0,0,0.7)', color: '#fff',
            padding: '8px 12px', borderRadius: '8px', zIndex: 3000,
            fontFamily: 'Segoe UI, system-ui, sans-serif', fontSize: '13px'
        });
        document.body.appendChild(toast);
        setTimeout(() => toast.style.opacity = '0.01', ms - 200);
        setTimeout(() => toast.remove(), ms);
    }

    els.minusBtn.addEventListener('click', () => adjustTime(-1));
    els.plusBtn.addEventListener('click', () => adjustTime(1));
    els.resetBtn.addEventListener('click', () => setLiveMode());
    els.playBtn.addEventListener('click', toggleTimer);

    els.smartInput.addEventListener('input', handleTimeInput);
    
    document.addEventListener('keydown', (e) => {
        if (e.altKey && (e.key === 'f' || e.key === 'F')) {
            e.preventDefault();
            els.smartInput.focus();
            els.smartInput.select();
        }
        if (e.key === 'ArrowLeft') adjustTime(-1);
        if (e.key === 'ArrowRight') adjustTime(1);
        if (e.key === 'r' || e.key === 'R') setLiveMode();
    });

    document.addEventListener('paste', (event) => {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
            return;
        }

        const pastedText = (event.clipboardData || window.clipboardData).getData('text').trim();
        const timeRegex = /^([01]\d|2[0-3]):([0-5]\d)(?::([0-5]\d))?$/;

        if (timeRegex.test(pastedText)) {
            const timeInput = els.smartInput;
            if (timeInput) {
                timeInput.value = pastedText;
                timeInput.dispatchEvent(new Event('input'));
                flashTemporary(`Время ${pastedText} применено`, 2000);
            }
        }
    });

    // Функция для генерации пожарных щитов
    function buildFireShields() {
        const existing = els.mapLayer.querySelectorAll('.fire-shield-marker');
        existing.forEach(n => n.remove());

        fireShieldsData.forEach(shield => {
            const marker = document.createElement('div');
            marker.className = 'fire-shield-marker';
            marker.setAttribute('data-id', shield.id);
            marker.style.left = shield.left;
            marker.style.top = shield.top;

            // При клике можно вывести уведомление (по желанию)
            marker.addEventListener('click', (ev) => {
                ev.stopPropagation();
                flashTemporary(`Указатель: ${shield.id}`, 2000);
            });

            els.mapLayer.appendChild(marker);
        });
    }

    function buildCameraButtons() {
        const existing = els.mapLayer.querySelectorAll('.camera-btn');
        existing.forEach(n => n.remove());
        
        cameras.forEach(cam => {
            const btn = document.createElement('button');
            btn.className = 'camera-btn';
            btn.setAttribute('data-name', cam.name);
            btn.setAttribute('aria-label', `Открыть камеру ${cam.name}`);
            btn.style.left = cam.left;
            btn.style.top = cam.top;
            btn.tabIndex = 0;

            btn.addEventListener('click', (ev) => {
                ev.stopPropagation();
                
                els.mapLayer.querySelectorAll('.camera-btn').forEach(b => b.classList.remove('active-selected'));
                btn.classList.add('active-selected');
                
                setActiveCam(cam);
                
                const timeToLoad = isLiveMode ? 0 : currentMs;
                const finalUrl = buildUrl(cam.url, timeToLoad);
                window.open(finalUrl, '_blank', 'noopener,noreferrer');
            });

            btn.addEventListener('keydown', (ev) => {
                if (ev.key === 'Enter' || ev.key === ' ') {
                    ev.preventDefault();
                    btn.click();
                }
            });

            els.mapLayer.appendChild(btn);
        });
    }

    async function init() {
        try {
            const response = await fetch(GAS_WEB_APP_URL);
            const rawData = await response.json();
            
            const uniqueNames = new Set();
            cameras = rawData.filter(cam => {
                if (!cam.name || !cam.name.trim()) return false;
                cam.name = cam.name.replace(/\s+/g, ' ').trim();
                if (!cam.url || !cam.url.trim() || cam.url === 'URL_ЗДЕСЬ') return false;
                if (uniqueNames.has(cam.name)) return false;
                uniqueNames.add(cam.name);
                cam.url = cam.url.trim();
                return true;
            });
            
            buildCameraButtons();
            buildFireShields(); // Вызываем отрисовку щитов
            
        } catch (error) {
            console.error('Ошибка загрузки камер:', error);
            flashTemporary('Не удалось загрузить список камер', 3000);
        } finally {
            els.loadingOverlay.style.opacity = '0';
            setTimeout(() => els.loadingOverlay.remove(), 500);
        }
    }

    init();
    setActiveCam(null);
    updateDisplay();
});
</script>
</body>
</html>
