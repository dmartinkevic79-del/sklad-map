<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SOFRINOKBT - Ultimate Glass Control</title>
    <style>
        :root {
            --neon-purple: #6f1cff00; /* Чуть ярче для акцентов на стекле */
            --neon-green: #00ff0052;
            /* Базовый цвет стекла (очень прозрачный) */
            --glass-color: rgba(255, 255, 255, 0.03); 
            /* Граница стекла */
            --glass-border: rgba(255, 255, 255, 0);
        }

        body { 
            margin: 0; 
            background: #03030365; /* Глубокий черный для контраста */
            color: #e0e0e0a0; 
            font-family: 'Segoe UI', 'Roboto', sans-serif; 
            overflow-x: hidden;
            letter-spacing: 0.5px;
        }

        /* УЛЬТРА-ГЛАСС ПАНЕЛЬ */
        .top-bar {
            position: fixed;
            top: 10px; /* Отступ от верха, чтобы панель "парила" */
            left: 50%;
            transform: translateX(-50%);
            width: 95%; /* Не на всю ширину */
            max-width: 1400px;
            height: 50px; /* Узкая и изящная */
            background: rgba(10, 10, 10, 0.5); /* Очень прозрачный фон */
            backdrop-filter: blur(20px) saturate(180%); /* Сильный блюр и сочность */
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 25px; /* Скругленные края */
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between; /* Распределяем элементы */
            padding: 0 25px;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 15px rgba(93, 2, 218, 0.1);
            box-sizing: border-box;
        }

        .bar-group { display: flex; align-items: center; gap: 10px; }

        /* ОБЩИЙ СТИЛЬ ДЛЯ ЭЛЕМЕНТОВ ГЛАССМОРФИЗМА */
        .glass-item {
            background: var(--glass-color);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 6px 14px;
            border-radius: 15px; /* Скругленные элементы внутри */
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        /* Кнопки как прозрачные элементы */
        .btn-glass {
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0);
            border-color: rgba(255, 255, 255, 0.011);
            transform: translateY(-1px);
        }

        /* Акцентные кнопки */
        .btn-purple { border-color: rgba(235, 233, 239, 0); color: #0e7a04f5; }
        .btn-purple:hover { border-color: var(--neon-purple); background: rgba(93, 2, 218, 0.1); color: #fff; }

        .btn-red { border-color: rgba(255, 0, 0, 0); color: #de0404; }
        .btn-red:hover { border-color: #ff0000; background: rgba(255, 0, 0, 0.15); color: #fff; box-shadow: 0 0 10px rgba(255,0,0,0.3); }

        .btn-active { background: rgba(255, 0, 0, 0.2) !important; border-color: #ff0000 !important; color: #fff !important; box-shadow: 0 0 15px rgba(255,0,0,0.5); }

        /* Инпуты */
        input[type="date"].glass-item { color-scheme: dark; font-family: inherit; cursor: pointer;}
        
        #smart-paste {
            width: 250px;
            border-style: dashed;
            color: #aaa;
            text-align: center;
        }
        #smart-paste:focus { border-style: solid; color: #ffffff08; border-color: var(--neon-purple); background: rgba(0,0,0,0.2); }

        /* Дисплей времени */
        .time-display {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 19px;
            color: var(--neon-green);
            padding: 4px 15px;
            text-shadow: 0 0 8px var(--neon-green);
            font-weight: bold;
        }

        /* КАРТА */
        .map-container { 
            position: relative; 
            margin-top: 80px; /* Отступ под парящую панель */
            display: inline-block;
            background: #000;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #111;
        }
        .map-img { 
            display: block; 
            max-width: 100%; 
            height: auto; 
            opacity: 0.8;
            filter: contrast(110%) brightness(90%); /* Стилизация карты */
        }
        
        /* Кнопки камер (тоже чуть более "стеклянные") */
        .camera-btn {
            position: absolute; width: 12px; height: 12px;
            background: rgba(92, 2, 218, 0); 
            border: 1px solid rgba(255, 255, 255, 0);
            border-radius: 50%; cursor: pointer; transform: translate(-50%, -50%);
            z-index: 10; transition: 0.3s ease;
            backdrop-filter: blur(2px);
        }
        .camera-btn:hover { 
            background: var(--neon-green); 
            box-shadow: 0 0 15px var(--neon-green), inset 0 0 5px rgba(255,255,255,0.5); 
            transform: translate(-50%, -50%) scale(1.6); 
            border-color: #fff;
        }
        .camera-btn::after {
            content: attr(data-name); position: absolute; bottom: 18px; left: 50%;
            transform: translateX(-50%); 
            background: rgba(10,10,10,0.8); backdrop-filter: blur(5px);
            color: #fff; padding: 4px 9px; border-radius: 10px; font-size: 10px; font-weight: 600;
            display: none; border: 1px solid var(--neon-purple); white-space: nowrap;
        }
        .camera-btn:hover::after { display: block; }

        .footer-sig {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0); padding: 12px;
            font-size: 11px; letter-spacing: 4px; font-weight: bold; color: #555555;
            border-top: 1px solid #11111100; text-align: center; text-transform: uppercase;
            z-index: 999;
        }
    </style>
</head>
<body>

<header class="top-bar">
    <div class="bar-group">
        <span style="font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 2px;">Дата</span>
        <input type="date" id="master-date" class="glass-item">
    </div>

    <div class="bar-group">
        <input type="text" id="smart-paste" class="glass-item" placeholder="SMART PASTE (CTRL+V)">
    </div>

    <div class="bar-group">
        <div id="clock-view" class="time-display">Время</div>
        <button id="play-btn" class="glass-item btn-glass btn-purple" style="width: 70px;" onclick="toggleTimer()">ПУСК</button>
    </div>

    <div class="bar-group">
        <button class="glass-item btn-glass" style="padding: 6px 10px;" onclick="adjustTime(-1)">-1м</button>
        <button class="glass-item btn-glass" style="padding: 6px 10px;" onclick="adjustTime(1)">+1м</button>
        <button class="glass-item btn-glass btn-red" onclick="resetToLive()">Сброс</button>
    </div>
</header>

<div class="map-container" id="wrapper">
    <img src="Sklad.png" class="map-img">
</div>

<footer class="footer-sig">
    D. Martinkevich // SofrinoKBT 
</footer>

    let timer = null;
    let currentMs = 0;

    const smartInput = document.getElementById('smart-paste');
    const dateInput = document.getElementById('master-date');
    const clockView = document.getElementById('clock-view');
    const playBtn = document.getElementById('play-btn');

    dateInput.valueAsDate = new Date();

    // SMART PASTE LOGIC
    smartInput.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if (!val) return;

        if (val.includes('date=')) {
            const match = val.match(/date=(\d+)/);
            if (match) {
                currentMs = parseInt(match[1]);
                const d = new Date(currentMs);
                dateInput.value = d.toISOString().split('T')[0];
            }
        } 
        else if (val.match(/^\d{1,2}:\d{2}/)) {
            const timeParts = val.split(':');
            const d = new Date(dateInput.value);
            d.setHours(parseInt(timeParts[0]));
            d.setMinutes(parseInt(timeParts[1]));
            d.setSeconds(parseInt(timeParts[2]) || 0);
            currentMs = d.getTime();
        }

        updateDisplay();
        smartInput.value = '';
        smartInput.placeholder = "SYNC OK";
        setTimeout(() => smartInput.placeholder = "SMART PASTE (CTRL+V)", 1500);
    });

    function updateDisplay() {
        if (currentMs === 0) {
            clockView.innerText = "Стоп";
            return;
        }
        const d = new Date(currentMs);
        clockView.innerText = d.toTimeString().split(' ')[0];
    }

    function toggleTimer() {
        if (timer) {
            clearInterval(timer);
            timer = null;
            playBtn.innerText = "ПУСК";
            playBtn.classList.remove('btn-active');
        } else {
            if (currentMs === 0) currentMs = new Date().getTime();
            timer = setInterval(() => {
                currentMs += 1000;
                updateDisplay();
            }, 1000);
            playBtn.innerText = "СТОП";
            playBtn.classList.add('btn-active');
        }
    }

    function adjustTime(mins) {
        if (currentMs === 0) return;
        currentMs += mins * 60000;
        updateDisplay();
    }

    function resetToLive() {
        if (timer) toggleTimer();
        currentMs = 0;
        updateDisplay();
    }

        const btn = document.createElement('div');
        btn.className = 'camera-btn';
        btn.style.left = cam.left; btn.style.top = cam.top;
        btn.setAttribute('data-name', cam.name);
        
        btn.onclick = () => {
            if (!cam.url) return;
            let finalUrl = cam.url;
            if (currentMs > 0) {
                const sep = finalUrl.includes('?') ? '&' : '?';
                finalUrl += `${sep}date=${currentMs}`;
            }
            window.open(finalUrl, '_blank');
        };
        wrapper.appendChild(btn);
    });
</script>

</body>
</html>
